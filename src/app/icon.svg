<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Overlap">
  <!--
    Two people and the time they share.
    
    The discs carry two of the member tints used throughout the app (ice and
    brass), and the lens where they meet is the one saturated colour the
    system reserves for the answer. So the mark is not a generic Venn: it is
    literally what the product renders, two members and their overlap.

    Drawn as SOLID shapes at deliberately large radii. The first attempt used
    1.5px grey rings on obsidian, which is a legible diagram at 32px and an
    almost empty dark square at the 16px a browser tab actually renders —
    which is why it looked like there was no favicon at all. Distinct hues do
    the separating here, so the two discs stay readable at tab size where a
    stroke between them would simply disappear.
  -->
  <rect width="32" height="32" rx="7" fill="#101010"/>
  <defs>
    <clipPath id="lens"><circle cx="12" cy="16" r="8.5"/></clipPath>
  </defs>
  <circle cx="12" cy="16" r="8.5" fill="#7fb2ff"/>
  <circle cx="20" cy="16" r="8.5" fill="#c9a227"/>
  <g clip-path="url(#lens)"><circle cx="20" cy="16" r="8.5" fill="#98ff38"/></g>
</svg>
